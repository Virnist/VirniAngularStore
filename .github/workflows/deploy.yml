name: Build Angular App with Infisical

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Копіюємо код проєкту на віртуальний сервер GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Встановлюємо Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. МАГІЯ: Звертаємося до Infisical за ключами
    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.7
      with:
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: "virni-store-log4" # ЗАМІНИ НА СВІЙ SLUG З КРОКУ 2 (наприклад, "virnistore")
        env-slug: "dev" # Оскільки ми закинули ключі в секцію Development

    # 4. Встановлюємо залежності проєкту (включаючи dotenv, який ми ставили раніше)
    - name: Install dependencies
      run: npm ci

    # npm run build generates environment.ts before building the app.
    - name: Build Angular Application
      run: npm run build -- --configuration production --base-href /VirniAngularStore/

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist/VirniAngularStore/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4