name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Спрацьовувати при пуші в main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ВИПРАВЛЕНО: Стабільна LTS версія Node.js, яка підтримує Angular

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href /VirniAngularStore/
        env:
          CI: false # ДОДАНО: Щоб GitHub проігнорував попередження (warnings) про ліміти CSS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/VirniAngularStore/browser # Шлях до вашої збірки

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4