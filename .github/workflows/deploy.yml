name: Build Angular App with Infisical

on:
  push:
    branches: [ main, master ] # Спрацьовує, коли ти робиш git push у main або master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Копіюємо код проєкту на віртуальний сервер GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Встановлюємо Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. МАГІЯ: Звертаємося до Infisical за ключами
    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.7
      with:
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: "virni-store-log4" # ЗАМІНИ НА СВІЙ SLUG З КРОКУ 2 (наприклад, "virnistore")
        env-slug: "dev" # Оскільки ми закинули ключі в секцію Development

    # 4. Встановлюємо залежності проєкту (включаючи dotenv, який ми ставили раніше)
    - name: Install dependencies
      run: npm ci

    # 5. Запускаємо наш set-env.js. Він візьме ключі з пам'яті process.env і створить файл для Angular
    - name: Generate Environment File
      run: node set-env.js

    # 6. Тестова збірка проєкту, щоб переконатися, що все компилюється без помилок
    - name: Build Angular Application
      run: npm run build

    # 7. Публікація зібраних файлів на GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/VirniAngularStore/browser